name: Run Pytest

on:
    pull_request:
        branches: ["main"]
            

jobs: 
    test:
      runs-on: macos-latest
      env:
        DB_USER: "postgres"

      steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.14'
        
        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Run pytest
          run: pytest

        - name: Print DB_USER
          run: echo "DB_USER -> ${DB_USER}"
